<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - SXC Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/sxc_logo_round.svg') }}">
    <link rel="icon" sizes="32x32" href="{{ url_for('static', filename='images/sxc_logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(14, 22, 30, 0.45), rgba(14, 22, 30, 0.45)),
                url("{{ url_for('static', filename='images/login_backdrop.jpg.jpg') }}") center/cover no-repeat fixed,
                #f2f4f7;
        }
        .college-header {
            background: linear-gradient(90deg, #7a0000, #a40000);
            color: #fff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .college-header img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; }
        .college-text h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .college-text h2 { margin: 2px 0; font-size: 18px; font-weight: 600; }
        .college-text p { margin: 0; font-size: 14px; opacity: 0.9; }
        .wrap {
            min-height: calc(100vh - 105px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: min(460px, 100%);
            background: rgba(255, 255, 255, 0.96);
            border-radius: 14px;
            box-shadow: 0 18px 32px rgba(0,0,0,0.2);
            padding: 24px;
        }
        h2 { margin: 0 0 8px; color: #7a0000; }
        p { margin: 0 0 14px; color: #4e5b69; font-size: 0.9rem; }
        .error, .success {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-align: center;
        }
        .error { background: #fdecea; color: #c0392b; }
        .success { background: #eaf8ef; color: #1f9254; }
        input {
            width: 100%;
            margin-top: 10px;
            padding: 11px 12px;
            border: 1px solid #d2d7de;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
        }
        input:focus { outline: none; border-color: #7a0000; }
        button {
            width: 100%;
            margin-top: 14px;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 700;
            background: #7a0000;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #5d0000; }
        .meta {
            margin-top: 12px;
            text-align: center;
            font-size: 0.9rem;
        }
        .meta a { color: #7a0000; text-decoration: none; font-weight: 700; }
        .meta a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="college-header">
        <img src="{{ url_for('static', filename='images/sxc_logo.png') }}" alt="SXC Logo">
        <div class="college-text">
            <h1>St. Xavier's College</h1>
            <h2>(Autonomous)</h2>
            <p>Palayamkottai, Tamil Nadu, India | Since 1923</p>
        </div>
    </div>

    <div class="wrap">
        <div class="card">
            <h2>Reset Password</h2>
            <p>Set a new password for your account.</p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="success">{{ success }}</div>
            {% endif %}

            {% if token_valid %}
            <form method="POST">
                <input type="password" name="password" placeholder="New Password" required autocomplete="new-password">
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required autocomplete="new-password">
                <button type="submit">Update Password</button>
            </form>
            {% endif %}

            <div class="meta">
                Back to <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </div>
</body>
</html>
